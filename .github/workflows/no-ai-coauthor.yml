name: No AI co-author trailers

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject Claude co-author trailers
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            args=("$BASE..$HEAD")
          else
            args=(-1 "$SHA")
          fi

          if git log --format='%B%x00' "${args[@]}" | grep -i 'Co-Authored-By: Claude'; then
            echo "::error::Commit messages must not contain a Claude co-author trailer."
            exit 1
          fi
