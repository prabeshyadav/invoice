<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verify your email</title>
</head>
<body style="margin:0;padding:24px;background:#f6f7fb;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
    <tr>
      <td style="padding:32px;">
        <p style="margin:0 0 8px;font-size:20px;font-weight:bold;">Verify your email</p>
        <p style="margin:0 0 16px;font-size:14px;">Hi {{ user.username }},</p>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#334155;">Thanks for signing up for InvoicePro. Confirm this is your email address to activate your account.</p>
        <p style="margin:0 0 24px;">
          <a href="{{ link }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;padding:12px 20px;border-radius:8px;">Verify email</a>
        </p>
        <p style="margin:0 0 8px;font-size:13px;color:#64748b;">Or paste this link into your browser:</p>
        <p style="margin:0 0 24px;font-size:13px;word-break:break-all;"><a href="{{ link }}" style="color:#4f46e5;">{{ link }}</a></p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b;">If you didn't create an account, you can ignore this email.</p>
      </td>
    </tr>
  </table>
</body>
</html>
