services:
  backend:
    build: .
    # Migrate on startup so fresh clones work without manual steps.
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      # Host 8000 is taken by another project; API is at :8002 on the host
      # (http://backend:8000 inside the compose network).
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Reachable from inside the compose network (browser stays same-origin;
      # Next.js proxies /api/* to this address server-side).
      - API_URL=http://backend:8000
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    # No host port mapping: host redis-server already uses 6379 for local
    # dev, and containers reach this instance as redis:6379 internally.

  celery_worker:
    build: .
    command: celery -A invoice worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  celery_beat:
    build: .
    command: celery -A invoice beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
